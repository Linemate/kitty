# This is a basic workflow to help you get started with Actions
#############
name: CI

# Controls when the workflow will run
on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout release
        uses: actions/checkout@v3


      - name: archive linemate
#        run: tar cvfz ./kitten.tar.gz *
        run: tar cvfz kitten.tar.gz --exclude='node_modules' --exclude='.github' .
          
      - name: AWS configure credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-northeast-2

      - name: upload to S3
        run: aws s3 cp --region ap-northeast-2 ./kitten.tar.gz s3://linemate/app/kitten/

      - name: deploy with AWS codeDeploy
        run: aws deploy create-deployment
          --application-name kitten
          --deployment-config-name CodeDeployDefault.AllAtOnce
          --deployment-group-name linemate-group
          --s3-location bucket=linemate,bundleType=tgz,key=app/kitten/kitten.tar.gz