on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Get Github action IP
        id: ip
        uses: haythem/public-ip@v1.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Set up environment variables
        run: |
          echo "NEXT_PUBLIC_API_HOST=$NEXT_PUBLIC_API_HOST" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_NAVER_ID=$NEXT_PUBLIC_NAVER_ID" >> $GITHUB_ENV

      - name: Add Github Actions IP to Security group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 3306 --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.REPO_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build \
            --build-arg NEXT_PUBLIC_API_HOST=https://puppy.linemate.kr \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }} \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_PW=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_PW }} \
            -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Get current ECS task definition
        id: task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition kitty \
            --query 'taskDefinition' > task-definition.json

      - name: Replace image in task definition
        run: |
          NEW_IMAGE="${{ steps.build-image.outputs.image }}"
          echo "📦 NEW IMAGE: $NEW_IMAGE"
          jq \
            --arg IMAGE "$NEW_IMAGE" \
            'del(
              .status,
              .revision,
              .taskDefinitionArn,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .inferenceAccelerators,
              .ephemeralStorage,
              .pidMode,
              .ipcMode,
              .proxyConfiguration,
              .tags
            ) | 
            .containerDefinitions[0].image = $IMAGE' \
            task-definition.json > new-task-def.json

      - name: Register new task definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Deploy new task definition to ECS
        run: |
          echo "🚀 Deploying task definition: ${{ steps.register-task-def.outputs.task_def_arn }}"
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service ${{ secrets.ECS_SERVICE_NAME }} \
            --task-definition ${{ steps.register-task-def.outputs.task_def_arn }} \
            --force-new-deployment

      - name: Remove Github Actions IP from Security Group
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 3306 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
